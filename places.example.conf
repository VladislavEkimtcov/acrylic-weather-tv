# Acrylic Weather places. Copy to places.conf, edit, then push it to the TV:
#   adb push places.conf /sdcard/Android/media/io.github.vladislavekimtcov.acrylicweather/places.conf
# and reopen the app. One place per line: Name | Region | latitude | longitude.
# The first place is the one that opens. Up to 12.
# Coordinates: https://geocoding-api.open-meteo.com/v1/search?name=Paris
New York | New York | 40.7128 | -74.0060
London | United Kingdom | 51.5074 | -0.1278
Tokyo | Japan | 35.6762 | 139.6503

# Optional:
# units=imperial        or metric (default: the TV's region; the °F | °C switch overrides it)
# clock=24h             or 12h (default: the TV's setting)
